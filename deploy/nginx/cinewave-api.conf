# Reverse proxy for the CineWave API. Install to /etc/nginx/sites-available/, symlink into
# sites-enabled/, replace api.example.com, then issue a certificate with:
#   sudo certbot --nginx -d api.example.com
# The app must run with TRUST_PROXY=1 behind this proxy.

upstream cinewave_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Image uploads: MAX_IMAGE_SIZE_MB × MAX_BULK_UPLOAD_FILES plus multipart overhead.
    client_max_body_size 110m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Public media is immutable (random keys) — let nginx cache it in front of Node.
    location /media/ {
        proxy_pass http://cinewave_api;
        expires 365d;
        access_log off;
    }

    # Probes are for the container runtime / monitoring, not the public.
    location /health/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cinewave_api;
    }

    location / {
        proxy_pass http://cinewave_api;
    }
}
